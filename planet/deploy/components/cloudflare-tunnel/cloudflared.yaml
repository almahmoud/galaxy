apiVersion: v1
kind: Namespace
metadata:
  name: planet-edge
  labels:
    app.kubernetes.io/part-of: planet
    app.kubernetes.io/component: edge
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: planet-edge
  labels:
    app.kubernetes.io/part-of: planet
automountServiceAccountToken: false
---
# Remotely managed tunnel: its public hostname and origin service
# (http://planet-gateway.planet.svc:8080) are set in the Cloudflare dashboard.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: planet-edge
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: planet
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: planet
    spec:
      serviceAccountName: cloudflared
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: planet-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: token
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: cloudflared-token
            defaultMode: 0440
            items:
              - key: token
                path: token
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: planet-edge
  labels:
    app.kubernetes.io/part-of: planet
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
