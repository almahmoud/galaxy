# Cloudflare Tunnel (cloudflared) in namespace planet-edge, publishing the gateway over HTTPS.
# Requires the Secret planet-edge/cloudflared-token, see planet/docs/cluster-setup.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - cloudflared.yaml

patches:
  - target:
      kind: NetworkPolicy
      name: planet-gateway-ingress
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: planet-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
