apiVersion: v1
kind: Namespace
metadata:
  name: planet-storage
  labels:
    app.kubernetes.io/part-of: planet
    app.kubernetes.io/component: storage
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  namespace: planet-storage
  labels:
    app.kubernetes.io/part-of: planet
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: planet-storage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: planet
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: planet-storage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: planet
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # A single node owns the volume; never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: planet
    spec:
      serviceAccountName: garage
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: planet-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          command: ["/garage"]
          # Creates the single-node layout, the default key and the default bucket on first start.
          args: ["server", "--single-node", "--default-bucket"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            - name: GARAGE_DEFAULT_BUCKET
              value: planet
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: rpc-secret
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: access-key-id
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-credentials
                  key: secret-access-key
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/garage
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: planet-storage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: planet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
