# rpc_secret and the default key come from the garage-credentials Secret through the
# GARAGE_RPC_SECRET and GARAGE_DEFAULT_* environment variables.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

# No root_domain: path-style requests only.
[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

# Serves /health for probes; without an admin token the administration endpoints stay closed.
[admin]
api_bind_addr = "0.0.0.0:3903"
