apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: planet
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Job pods carry batch.kubernetes.io/job-name, so they cannot reach the gateway, which
# forwards to the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: planet-gateway-ingress
  namespace: planet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: planet-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: DoesNotExist
      ports:
        - protocol: TCP
          port: 8080
---
# Tool pods may reach DNS and any address except the cloud instance-metadata endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: planet-jobs-egress
  namespace: planet
spec:
  podSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
  policyTypes: ["Egress"]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
        - ipBlock:
            cidr: ::/0
            except: ["fd00:ec2::254/128"]
