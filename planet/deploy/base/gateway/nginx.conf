worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    default_type application/json;
    server_tokens off;
    keepalive_timeout 65s;
    gzip off;

    # Query strings are not logged: presigned S3 URLs carry their signature there.
    log_format planet '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                      '$body_bytes_sent ${request_time}s origin="$http_origin"';
    access_log /dev/stdout planet;

    map $http_origin $origin_allowed {
        default 0;
        include /etc/nginx/planet/allowed-origins.map;
    }

    # A request without Origin is not a CORS request; the bearer token still guards it.
    map "$origin_allowed:$http_origin" $origin_rejected {
        default 1;
        "~^1:" 0;
        "0:" 0;
    }

    # Each server sets $planet_cors_methods, $planet_cors_headers and $planet_cors_expose.
    # add_header skips empty values, so preflight-only headers appear on preflights only.
    map "$origin_allowed:$request_method" $cors_preflight {
        default 0;
        "1:OPTIONS" 1;
    }
    map $origin_allowed $cors_allow_origin {
        default "";
        1 $http_origin;
    }
    map $origin_allowed $cors_expose_headers {
        default "";
        1 $planet_cors_expose;
    }
    map $cors_preflight $cors_allow_methods {
        default "";
        1 $planet_cors_methods;
    }
    map $cors_preflight $cors_allow_headers {
        default "";
        1 $planet_cors_headers;
    }
    map $cors_preflight $cors_max_age {
        default "";
        1 7200;
    }
    map "$cors_preflight:$http_access_control_request_private_network" $cors_allow_private_network {
        default "";
        "1:true" "true";
    }

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Expose-Headers $cors_expose_headers always;
    add_header Access-Control-Allow-Methods $cors_allow_methods always;
    add_header Access-Control-Allow-Headers $cors_allow_headers always;
    add_header Access-Control-Max-Age $cors_max_age always;
    add_header Access-Control-Allow-Private-Network $cors_allow_private_network always;
    add_header Vary Origin always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Access-Control-Allow-Private-Network;

    # Probes only; the Service does not expose this port.
    server {
        listen 8090;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
